- time: "08:30–09:05"
  title: "Talk"
  speaker: "Sergei Gukov"
  affiliation: "Caltech · American Institute of Mathematics"
  talk_title: "The role of AI in mathematical (re)search"
  abstract: >-
    At its core, scientific research is a search, a search for new ideas, new
    patterns, and new ways to explain or prove things. In this talk, I invite
    you to explore how AI is reshaping different stages of this process. We
    will see that while AI excels at many tasks, it still hesitates on others,
    such as long-horizon reasoning or far-out-of-distribution generalization. I
    view this as good news: it highlights how much meaningful AI research
    remains to be done. In fact, the goal of expanding AI's role in
    mathematical research has become a motivation for advancing AI itself. I am
    genuinely excited that these two fields have come into such close contact
    over the past few years.
  type: talk

