- time: "10:00–10:35"
  title: "Talk"
  speaker: "Tim Gehrunger"
  affiliation: "ETH Zurich"
  talk_title: "Agentic AI for Mathematical Research"
  abstract: >-
    Can frontier AI systems make autonomous progress on research-level
    mathematical problems? Can mathematicians use them to accelerate their own
    research in substantive ways? As model capabilities improve, the answer to
    both questions is an increasingly confident, though still cautious, "yes."
    In this talk, I will survey the mathematical reasoning capabilities of
    current frontier models, with a particular focus on agentic systems for
    theorem proving and mathematical exploration. I will discuss what these
    systems can already do, where they still fail, and what kinds of workflows
    seem most promising for human-AI collaboration. I will then examine the
    results from the First Proof, Second Batch competition in detail, with a
    focus on the design and performance of ProofCouncil, an agentic system for
    research-level mathematics.
  type: talk

- time: "10:35–11:10"
  title: "Talk"
  speaker: "Niao He"
  affiliation: "ETH Zurich"
  talk_title: "From Learning to Discovery: Lessons from a Semester of AI-Assisted Optimization Seminar"
  abstract: >-
    Can AI enable students to contribute to research before completing the
    traditional path to expertise? And can working on research open problems
    itself become an effective mode of learning? In a semester-long seminar,
    teams of bachelor's and master's students used AI tools to investigate nine
    open problems in optimization. Drawing on both successful and unresolved
    cases, this talk explores how AI can support just-in-time learning,
    accelerate mathematical exploration, and enable earlier participation in
    research.
  type: talk

