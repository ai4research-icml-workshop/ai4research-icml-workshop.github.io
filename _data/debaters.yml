- name: Ludwig Schmidt
  affiliation: "Stanford University"
  photo: /assets/img/debaters/schmidt.jpg
  bio: >-
    Ludwig Schmidt is an Assistant Professor in Stanford University's Computer
    Science Department and Stanford Data Science. His research focuses on the
    foundations of machine learning, often with an emphasis on datasets,
    multimodality, reliable generalization, and language models. He is also a
    member of technical staff at Anthropic and LAION.
  website: "https://people.csail.mit.edu/ludwigs/"
  scholar: "https://scholar.google.com/citations?user=SWMKy70AAAAJ&hl=en"
