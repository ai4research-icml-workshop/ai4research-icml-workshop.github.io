- name: Niloofar Mireshghallah
  affiliation: "humans&"
  photo: /assets/img/debaters/mireshghallah.jpg
  bio: >-
    Niloofar Mireshghallah is a Member of Technical Staff at humans&.
    Beginning Fall 2026, she will join Carnegie Mellon University's Engineering
    & Public Policy Department and Language Technologies Institute as an
    Assistant Professor. Her research spans privacy, natural language
    processing, AI for science, LLM reasoning, and the societal implications of
    machine learning.
