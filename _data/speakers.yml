- name: Sergei Gukov
  affiliation: "Caltech · American Institute of Mathematics"
  photo: /assets/img/speakers/gukov.jpg
  bio: >-
    Sergei Gukov is the John D. MacArthur Professor of Theoretical Physics and
    Mathematics at Caltech, Director of the Merkin Center for Pure and Applied
    Mathematics, and Consulting Director of the American Institute of
    Mathematics. His research interests include mathematics and machine
    learning, quantum topology, gauge theory, and knot and 3-manifold
    invariants.
  website: "https://www.gukov.caltech.edu/"
  scholar: ""

- name: Remy Degenne
  affiliation: "University of Lille · Inria"
  photo: /assets/img/speakers/degenne.jpg
  bio: >-
    Remy Degenne is a tenured researcher in the Scool team at the Inria centre
    at the University of Lille. He works on sequential machine learning,
    especially bandit theory, and is interested in online and reinforcement
    learning, statistics, and optimization. He is also a maintainer of Mathlib
    for the Lean theorem prover.
  website: "https://remydegenne.github.io/"
  scholar: ""

- name: Tim Gehrunger
  affiliation: "ETH Zurich"
  photo: /assets/img/speakers/gehrunger.jpg
  bio: >-
    Tim Gehrunger is a postdoctoral researcher in arithmetic geometry at ETH
    Zurich. His research focuses on stable reduction of hyperelliptic curves and
    applications to the Parity conjecture. He is part of the organizing team of
    IMProofBench and has contributed questions to research-level datasets
    including Humanity's Last Exam.
  website: "https://people.math.ethz.ch/~timge/"
  scholar: ""

- name: Diyi Yang
  affiliation: "Stanford University"
  photo: /assets/img/speakers/yang.jpg
  bio: >-
    Diyi Yang is an Assistant Professor in the Computer Science Department at
    Stanford University, affiliated with the Stanford NLP Group, Stanford HCI
    Group, SAIL, and Stanford HAI. Her research focuses on socially aware NLP,
    large language models, and human-AI interaction, with an emphasis on
    human-centered AI systems.
  website: "https://cs.stanford.edu/~diyiy/"
  scholar: ""

- name: Niao He
  affiliation: "ETH Zurich"
  photo: /assets/img/speakers/he.jpg
  bio: >-
    Niao He is an Associate Professor in the Department of Computer Science at
    ETH Zurich and leads the Optimization & Decision Intelligence Group. Her
    research lies at the interface of optimization and machine learning, with a
    focus on algorithmic and theoretical foundations for principled, scalable,
    and trustworthy decision intelligence.
  website: "https://odi.inf.ethz.ch/niaohe"
  scholar: ""

- name: Mehtaab Sawhney
  affiliation: "Columbia University / OpenAI"
  photo: /assets/img/speakers/sawhney.jpg
  bio: >-
    Mehtaab Sawhney is a Clay Research Fellow and a tenure-track assistant
    professor at Columbia University. His research interests are broadly within
    combinatorics, probability, analytic number theory, and theoretical
    computer science.
  website: "https://www.math.columbia.edu/~msawhney/"
  scholar: ""
